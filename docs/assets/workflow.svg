<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">End-to-end refund workflow</title><desc id="desc">Five steps from customer request to persisted refund evidence, including runtime constraints and separate exact application approvals.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7e9aab"/></marker></defs><rect x="0" y="0" width="1600" height="720" rx="28" fill="#edf6fd" stroke="none"/><text x="55" y="75" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700">From customer request to governed action</text><text x="57" y="120" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">The model proposes. The operator reviews. The runtime checks the call.</text><rect x="55" y="185" width="280" height="237" rx="22" fill="#fff" stroke="none"/><g transform="translate(77 210) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 2h6v4H9zM9 11h6M9 15h4"/></g><text x="266" y="240" fill="#718ca0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">01</text><text x="77" y="292" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Customer request</text><text x="77" y="335" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Damaged desk lamp</text><text x="77" y="365" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Request: Rs 400</text><path d="M337 300L352 300" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="355" y="185" width="280" height="237" rx="22" fill="#fff" stroke="none"/><g transform="translate(377 210) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M2 11v5M22 11v5M8 12h.01M16 12h.01M9 16h6"/></g><text x="566" y="240" fill="#718ca0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">02</text><text x="377" y="292" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Saved proposal</text><text x="377" y="335" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Governed payment lookup</text><text x="377" y="365" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">AI amount + rationale</text><path d="M637 300L652 300" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="655" y="185" width="280" height="237" rx="22" fill="#fff" stroke="none"/><g transform="translate(677 210) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/></g><text x="866" y="240" fill="#718ca0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">03</text><text x="677" y="292" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Operator review</text><text x="677" y="335" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Reject or execute</text><text x="677" y="365" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Use server-stored action</text><path d="M937 300L952 300" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="955" y="185" width="280" height="237" rx="22" fill="#fff" stroke="none"/><g transform="translate(977 210) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6"/></g><text x="1166" y="240" fill="#718ca0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">04</text><text x="977" y="292" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Runtime decision</text><text x="977" y="335" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Ticket payment only</text><text x="977" y="365" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Per-call amount policy</text><path d="M1237 300L1252 300" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1255" y="185" width="280" height="237" rx="22" fill="#fff" stroke="none"/><g transform="translate(1277 210) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></g><text x="1466" y="240" fill="#718ca0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">05</text><text x="1277" y="292" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Provider result</text><text x="1277" y="335" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Razorpay TEST receipt</text><text x="1277" y="365" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Initiated ≠ settled</text><path d="M1094 424L1094 475" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="485" width="730" height="135" rx="22" fill="#fff" stroke="none"/><g transform="translate(825 510) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h12l4 4v14H4zM15 3v5h5M8 12h8M8 16h5"/></g><text x="885" y="532" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Persist evidence; stop on uncertainty</text><text x="886" y="570" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Duplicate blocked • unknown result → manual reconciliation</text><rect x="55" y="485" width="700" height="135" rx="22" fill="#fff" stroke="none"/><g transform="translate(80 510) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/></g><text x="140" y="532" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Above Rs 500: exact application approval</text><text x="140" y="570" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Tool + payment + amount • 5 minutes • single use</text><text x="59" y="677" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">AgntID policy denial stops the refund tool. Application approvals are a separate control.</text></svg>