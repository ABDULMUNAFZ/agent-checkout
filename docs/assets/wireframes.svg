/><g transform="translate(845 742) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6M7 13l-2 2a4 4 0 006 6l3-3M17 11l2-2a4 4 0 00-6-6l-3 3"/></g><text x="905" y="772" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Connections &amp; setup</text><text x="905" y="815" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Model, TEST payments, balances and policy configuration</text><text x="57" y="919" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Schematic wireframes — actual screenshots are shown separately in the README.</text></svg>