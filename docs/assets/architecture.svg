<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" role="img" aria-labelledby="title desc"><title id="title">Deployment architecture</title><desc id="desc">AgntID console synchronizes policy to the private AWS runtime; the support app calls the runtime, which controls the private payment MCP before Razorpay TEST execution.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7e9aab"/></marker></defs><rect x="0" y="0" width="1600" height="810" rx="28" fill="#edf6fd" stroke="none"/><text x="55" y="75" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700">Architecture: control centrally, execute in our infrastructure</text><rect x="55" y="125" width="1490" height="138" rx="22" fill="#fff" stroke="none"/><g transform="translate(82 165) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6"/></g><text x="145" y="173" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">AgntID console</text><text x="145" y="213" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Tool review • exact resource scope • per-tool amount policies • runtime reporting</text><path d="M803 267L803 315" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="828" y="298" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Policy sync / audit</text><rect x="55" y="330" width="1200" height="425" rx="22" fill="#d4eafa" stroke="none"/><text x="85" y="370" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">AWS / PRIVATE DOCKER NETWORK</text><rect x="90" y="413" width="350" height="218" rx="22" fill="#fff" stroke="none"/><g transform="translate(114 437) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 2h6v4H9zM9 11h6M9 15h4"/></g><text x="114" y="512" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Support app</text><text x="114" y="550" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Saved resolution</text><text x="114" y="578" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Operator review</text><text x="114" y="606" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">SQLite evidence</text><rect x="490" y="413" width="350" height="218" rx="22" fill="#fff" stroke="none"/><g transform="translate(514 437) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6"/></g><text x="514" y="512" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">AgntID runtime</text><text x="514" y="550" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">MCP interception</text><text x="514" y="578" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Payment + amount</text><text x="514" y="606" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Independent tool decision</text><rect x="890" y="413" width="350" height="218" rx="22" fill="#fff" stroke="none"/><g transform="translate(914 437) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></g><text x="914" y="512" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Payment MCP</text><text x="914" y="550" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">TEST key kept here</text><text x="914" y="578" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Exact approval gate</text><text x="914" y="606" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Provider connector</text><path d="M443 521L480 521" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M843 521L880 521" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1290" y="369" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">EXTERNAL API</text><rect x="1270" y="413" width="245" height="218" rx="22" fill="#fff" stroke="none"/><g transform="translate(1300 437) scale(1.5)" fill="none" stroke="#183549" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></g><text x="1300" y="512" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Razorpay</text><text x="1300" y="551" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">TEST API</text><text x="1300" y="581" fill="#567085" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Refund receipt</text><path d="M1243 521L1260 521" stroke="#7e9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="93" y="696" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">OpenAI recommends through the app. Caddy serves HTTPS. Runtime administration stays private.</text><text x="93" y="729" fill="#183549" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Only the app is public; the payment MCP has no public host port.</text></svg>